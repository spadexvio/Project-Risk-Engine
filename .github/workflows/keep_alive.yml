name: Keep WIRATOR Awake

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Visit Streamlit App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto('YOUR_STREAMLIT_APP_URL_HERE', timeout=60000)
              page.wait_for_timeout(5000)
              # If sleeping, click the wake up button automatically
              wake_button = page.query_selector('button:has-text(\"Yes, get this app back up!\")')
              if wake_button:
                  wake_button.click()
                  page.wait_for_timeout(10000)
              print('WIRATOR pinged successfully!')
              browser.close()
          "
