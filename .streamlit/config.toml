base = "light"

# Your institutional theme colors
primaryColor = "#1A2B4C"
backgroundColor = "#E8F5E9"       #"#E4EFEB"              #"#F0F7F1"                       #"#EAF2EC"
secondaryBackgroundColor = "#E2E8F0"
textColor = "#1A2B4C"
font = "sans serif"
